name: Add Grammar

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: "GitHub repository URL (e.g. https://github.com/tree-sitter/tree-sitter-kotlin)"
        required: true
        type: string
      paths:
        description: "Comma-separated paths inside the repo to place (default: src). Monorepos e.g. typescript/src,tsx/src,common"
        required: false
        type: string
        default: "src"

jobs:
  add-grammar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 1
          fetch-tags: false
          submodules: false
          lfs: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up tools (mise)
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5

      - name: Add #grammar entry and lock
        id: add
        env:
          REPO_URL: ${{ inputs.repo_url }}
          PATHS: ${{ inputs.paths }}
          # workspaced mod lock / place need authenticated GitHub API+codeload.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          url="${REPO_URL%%#*}"
          url="${url%%\?*}"
          url="${url%/}"
          url="${url%.git}"

          if [[ "$url" =~ ^https?://github\.com/([^/]+)/([^/]+)$ ]]; then
            owner="${BASH_REMATCH[1]}"
            repo="${BASH_REMATCH[2]}"
          elif [[ "$url" =~ ^git@github\.com:([^/]+)/([^/]+)$ ]]; then
            owner="${BASH_REMATCH[1]}"
            repo="${BASH_REMATCH[2]}"
            repo="${repo%.git}"
          elif [[ "$url" =~ ^([^/]+)/([^/]+)$ ]]; then
            owner="${BASH_REMATCH[1]}"
            repo="${BASH_REMATCH[2]}"
          else
            echo "::error::Could not parse GitHub repo from: ${REPO_URL}"
            exit 1
          fi

          spec="${owner}/${repo}"
          echo "Adding grammar: ${spec} paths=${PATHS}"
          ./setup-grammars "${spec}" "${PATHS}"

          mise run grammars:lock

          echo "repo_name=${repo}" >> "$GITHUB_OUTPUT"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "clone_url=https://github.com/${owner}/${repo}.git" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: add ${{ steps.add.outputs.repo_name }} grammar source"
          title: "Add grammar: ${{ steps.add.outputs.repo_name }}"
          body: |
            Automated addition of a tree-sitter grammar via workspaced `#grammar` + `core:place`.

            | | |
            |---|---|
            | **Repository** | [${{ steps.add.outputs.owner }}/${{ steps.add.outputs.repo_name }}](${{ steps.add.outputs.clone_url }}) |
            | **Paths** | `${{ inputs.paths }}` |
            | **Source input** | `${{ inputs.repo_url }}` |

            Grammar C sources are materialised under `third-party/` by `workspaced codebase apply` (gitignored). After merge, run **Codegen and Test** (or wait for weekly schedule / push to `main`) to generate Go bindings under `grammar/`.

            Triggered by @${{ github.actor }} via workflow_dispatch.
          branch: "add-grammar/${{ steps.add.outputs.repo_name }}"
          delete-branch: true
          add-paths: |
            workspaced.cue
            workspaced.lock.json
